name: Deployment Build Guard

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  deploy-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Validate deployment build
        run: npm run deploy:check
